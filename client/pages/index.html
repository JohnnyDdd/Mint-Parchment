<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Mint Parchment</title>
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon.png">
  <link rel="stylesheet" href="/css/test.css">
  <script src="/js/general.js" defer></script>
  <script type="module" src="/js/homepage.js" defer></script>
</head>

<body>
  <span id="NavBtn" onclick="openNav()">&#9776;</span>
  <div id="mySidenav" class="sidenav">
    <img id="appIcon" src="/assets/icons/Mint Parchment App Icon.png">
    <a href="#">New Session</a>
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <a href="#" onclick="window.open('mindmapCanvas.html','_blank')">Draw MindMap</a>
    <a href="#" id="noteBtn">Open Notes</a>
    <a href="#">Clients</a>
    <a href="#">Contact</a>
    <br>
    <br>
    <p id="chatHeader" style="text-align: center; margin-right: 5%;"><strong>Chat History</strong></p>
  </div>

  <div id="main">
    <div class="note-editor">

      <div class="toolbar" aria-label="Formatting">
        <button data-cmd="bold" title="Bold (Ctrl + B)"><b>B</b></button>
        <button data-cmd="italic" title="Italic (Ctrl + I)"><i>I</i></button>
        <button data-cmd="underline" title="Underline (Ctrl + U)"><u>U</u></button>
        <span class="sep"></span>
        <select id="size" aria-label="Font size">
          <option value="3">Normal</option>
          <option value="2">Small</option>
          <option value="5">Large</option>
          <option value="6">Heading</option>
        </select>
        <button data-cmd="insertUnorderedList" title="Bulleted list">List</button>
        <span class="sep"></span>
        <button id="save" class="primary push">Save as .txt</button>
      </div>


      <div id="note-container" contenteditable="true" spellcheck="true" aria-label="Note text"></div>

    </div>

    <div class="container" id="promptCont">
      <textarea id="promptBox" placeholder="Start typing your prompts..."></textarea>
      <button id="startBtn">Send</button>
    </div>

  </div>
  <footer class="site-footer">
    <p>© 2026 Mint Parchment. All rights reserved.</p>
  </footer>
</body>

</html>
